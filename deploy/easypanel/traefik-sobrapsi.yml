# Traefik File Provider — EasyPanel (entryPoints: http, https).
# Nao inclua comentarios com chaves duplas neste arquivo (Go template).
#
# O modo manutencao agora e feito na aplicacao (MAINTENANCE_MODE no .env),
# com pagina amigavel em /manutencao e acesso via /?acesso=SEGREDO.
# Por isso este arquivo faz apenas o roteamento HTTPS simples.

http:
  routers:
    sobrapsi:
      rule: Host(`sobrapsi.org.br`) || Host(`www.sobrapsi.org.br`)
      entryPoints:
        - https
      service: sobrapsi
      tls:
        certResolver: letsencrypt

  services:
    sobrapsi:
      loadBalancer:
        servers:
          - url: http://sobrapsi-app:3000
